                <h2>hablemos</h2>
                <p>Completá el formulario con tu duda o información del proyecto <br>y a la brevedad me pondré en
                    contacto con vos.</p>
            </div>


            <form class="formulario-contacto" action="#" method="POST">
                <div class="fila-input">
                    <input type="text" name="Nombre" id="Nombre" maxlength="30" placeholder="Tu nombre">

                <div class="fila-mensaje">
                    <textarea name="Tu mensaje" id="Tu mensaje" placeholder="Escribí aca tu mensaje"></textarea>
                    <input type="submit" value="Enviar" class="btn-enviar">
                </div>
            </form>
        </section>
